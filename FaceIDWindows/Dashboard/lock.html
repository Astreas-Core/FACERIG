<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceID Lock</title>
    <!-- Use Inter as a modern, lightweight fallback for Segoe UI Variable -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --glass-bg: rgba(20, 20, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --primary: #60A5FA;
            --success: #34d399;
            --error: #fbbf24;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI Variable', 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            user-select: none;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }
        
        body.fade-out { opacity: 0; }

        /* Atmospheric Background */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .ambient-glow {
            position: absolute;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.04) 0%, rgba(0,0,0,0) 60%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Top Area */
        .top-bar {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .brand {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
        }

        /* Centerpiece */
        .auth-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .glass-orb {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 var(--glass-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Circular Ring for Verifying */
        .progress-ring {
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-right-color: rgba(96, 165, 250, 0.2);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        
        /* State: Verifying */
        .state-verifying .progress-ring {
            opacity: 1;
            animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* State: Success Expansion */
        .success-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid var(--success);
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }
        .state-success .success-ring {
            animation: successExpand 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .state-success.glass-orb {
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 var(--glass-highlight),
                0 0 40px rgba(52, 211, 153, 0.15);
            border-color: rgba(52, 211, 153, 0.3);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes successExpand {
            0% { transform: scale(1); opacity: 1; border-width: 2px; }
            100% { transform: scale(1.6); opacity: 0; border-width: 0px; }
        }

        /* Biometric Face Vector */
        .face-svg {
            width: 130px;
            height: 130px;
            stroke: rgba(255, 255, 255, 0.6);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .state-searching .face-svg {
            animation: breathe 3s infinite ease-in-out;
        }
        .state-detected .face-svg {
            stroke: var(--primary);
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.3));
            transform: scale(1.05);
        }
        .state-verifying .face-svg {
            stroke: var(--primary);
            opacity: 0.8;
        }
        .state-success .face-svg {
            stroke: var(--success);
            filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.4));
            transform: scale(0.9);
        }
        .state-error .face-svg {
            stroke: var(--error);
        }

        /* SVG Morphing */
        #faceContour {
            transform-origin: center;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #checkMark {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s, opacity 0.3s;
        }
        .state-success #faceContour {
            opacity: 0;
            transform: scale(0.8);
        }
        .state-success #checkMark {
            opacity: 1;
            stroke-dashoffset: 0;
        }

        @keyframes breathe {
            0% { stroke: rgba(255, 255, 255, 0.3); transform: scale(0.98); }
            50% { stroke: rgba(255, 255, 255, 0.7); transform: scale(1.02); }
            100% { stroke: rgba(255, 255, 255, 0.3); transform: scale(0.98); }
        }

        /* Scanning Line */
        .scan-line {
            position: absolute;
            top: 20%; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 12px var(--primary);
            opacity: 0;
            pointer-events: none;
        }
        .state-searching .scan-line {
            animation: scan 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes scan {
            0% { top: 15%; opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 85%; opacity: 0; }
        }

        /* Text Area */
        .text-container {
            text-align: center;
            height: 90px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        h1 {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            transition: color 0.4s;
        }
        p {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: color 0.4s;
        }

        /* Bottom Area */
        .bottom-bar {
            position: absolute;
            bottom: 80px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .action-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .action-link:hover { 
            color: rgba(255, 255, 255, 0.9); 
            background: rgba(255, 255, 255, 0.05);
        }

        /* Fallback PIN */
        .fallback-div {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fallback-div.show {
            display: flex;
            opacity: 1;
        }
        .pin-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            letter-spacing: 8px;
            text-align: center;
            width: 220px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(15px);
        }
        .pin-input:focus { 
            border-color: rgba(255, 255, 255, 0.4); 
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
        }

    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="ambient-glow"></div>
    </div>

    <div class="top-bar">
        <div class="brand">FaceID Windows</div>
    </div>

    <div class="auth-container">
        <!-- class controls state: state-searching, state-detected, state-verifying, state-success, state-error -->
        <div class="glass-orb state-searching" id="authOrb">
            <div class="progress-ring"></div>
            <div class="success-ring"></div>
            
            <!-- Abstract Biometric Vector -->
            <svg class="face-svg" id="faceIcon" viewBox="0 0 24 24" fill="none" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round">
                <g id="faceContour">
                    <!-- Abstract Face Contour -->
                    <path d="M5 8c0-3.5 3.5-6 7-6s7 2.5 7 6v5c0 4.5-3.5 7-7 7s-7-2.5-7-7V8z" />
                    <!-- Eyes/Sensors -->
                    <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none" />
                    <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none" />
                    <!-- Scanning reticle marks -->
                    <path d="M3 12h2M19 12h2" opacity="0.3" />
                    <path d="M12 3v2M12 19v2" opacity="0.3" />
                </g>
                <!-- Checkmark (hidden initially via CSS stroke-dashoffset) -->
                <path id="checkMark" d="M20 7L10 17l-5-5" stroke-width="1.5" stroke-dasharray="30" stroke-dashoffset="30" opacity="0" />
            </svg>
            
            <div class="scan-line"></div>
        </div>

        <div class="text-container">
            <h1 id="statusTitle">Looking for you</h1>
            <p id="statusSubtitle">Position your face within the frame</p>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="fallback-div" id="fallbackDiv">
            <input type="password" id="fallbackPwd" class="pin-input" placeholder="PIN" maxlength="4">
        </div>
        
        <div class="action-link" id="usePinBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Sign-in options
        </div>
    </div>

    <script src="lock-renderer.js"></script>
</body>
</html>
